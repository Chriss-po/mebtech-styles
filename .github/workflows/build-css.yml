name: Build MebTech CSS & JS

on:
  push:
    paths:
      - "src/**.css"
      - "src/**.js"
      - "src/js/**"
      - ".github/workflows/build-css.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production CSS and JS assets
        shell: bash
        run: |
          mkdir -p dist
          cat > dist/mebtech.css <<'EOF'
          /*
          ============================================================
          MEBTECH PRODUCTION STYLESHEET
          Generated from /src. Do not edit dist directly.
          ============================================================
          */
          EOF

          cat src/01-foundations.css >> dist/mebtech.css
          printf '\n' >> dist/mebtech.css
          cat src/02-reset.css >> dist/mebtech.css
          printf '\n' >> dist/mebtech.css
          cat src/03-base.css >> dist/mebtech.css
          printf '\n' >> dist/mebtech.css
          cat src/04-layout.css >> dist/mebtech.css
          printf '\n' >> dist/mebtech.css
          cat src/05-components.css >> dist/mebtech.css
          printf '\n' >> dist/mebtech.css
          cat src/06-forms.css >> dist/mebtech.css
          printf '\n' >> dist/mebtech.css
          cat src/07-utilities.css >> dist/mebtech.css
          printf '\n' >> dist/mebtech.css
          cat src/08-responsive.css >> dist/mebtech.css
          printf '\n' >> dist/mebtech.css
          cat src/09-site-adapters.css >> dist/mebtech.css
          printf '\n' >> dist/mebtech.css
          cat src/10-desktop-header.css >> dist/mebtech.css
          # Keep previously released standalone endpoints for rollback.
          cp src/js/01-expandable-hero.js dist/mebtech-expandable.js
          cp src/js/02-desktop-header.js dist/mebtech-desktop-header.js
          cp src/js/03-furniture-showcase.js dist/mebtech-furniture-showcase.js

          # One production JS entrypoint; each self-contained module remains
          # in its own source file and is separated by an ASI-safe semicolon.
          {
            printf '/* MEBTECH PRODUCTION JAVASCRIPT BUNDLE. Generated from src/js; do not edit directly. */\n'
            cat src/js/01-expandable-hero.js
            printf '\n;\n'
            cat src/js/02-desktop-header.js
            printf '\n;\n'
            cat src/js/03-furniture-showcase.js
            printf '\n'
          } > dist/mebtech.js

      - name: Commit generated production assets
        shell: bash
        run: |
          git add dist/mebtech.css dist/mebtech.js dist/mebtech-expandable.js dist/mebtech-desktop-header.js dist/mebtech-furniture-showcase.js
          if git diff --cached --quiet; then
            echo "No build changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: update mebtech CSS and JS bundles"
          git push
